name: Build Android Termux Binaries

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'luajit/**'
      - 'luai-termux/**'
      - '.github/workflows/build-termux.yml'
  release:
    types:
      - published
      - created
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64:
    name: Build ARM 64-bit (aarch64) with Android NDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | tail -n 1)
          fi
          echo "NDK_PATH=$NDK" >> $GITHUB_ENV
          echo "TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_ENV
          echo "Using Android NDK: $NDK"

      - name: Build LuaJIT for Android ARM64
        run: |
          make -C luajit/src clean
          make -C luajit/src -j$(nproc) \
            STATIC_CC="$TOOLCHAIN/aarch64-linux-android24-clang" \
            DYNAMIC_CC="$TOOLCHAIN/aarch64-linux-android24-clang -fPIC" \
            TARGET_LD="$TOOLCHAIN/aarch64-linux-android24-clang" \
            TARGET_AR="$TOOLCHAIN/llvm-ar rcus" \
            TARGET_STRIP="$TOOLCHAIN/llvm-strip" \
            TARGET_SYS=Linux \
            BUILDMODE=static \
            XCFLAGS="-DLUAJIT_ENABLE_LUA52COMPAT -DLUAJIT_UNWIND_EXTERNAL"

      - name: Compile Luai ARM64 Binary
        run: |
          $TOOLCHAIN/aarch64-linux-android24-clang++ -O2 -std=c++17 -static-libstdc++ \
            -Iluajit/src src/lexer.cpp src/runtime.cpp src/repl.cpp src/main.cpp \
            luajit/src/libluajit.a -o luai-arm64
          $TOOLCHAIN/llvm-strip luai-arm64
          ls -lh luai-arm64
          file luai-arm64

      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luai-arm64
          path: luai-arm64

  build-arm32:
    name: Build ARM 32-bit (armv7l / armhf) with Android NDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | tail -n 1)
          fi
          echo "NDK_PATH=$NDK" >> $GITHUB_ENV
          echo "TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_ENV
          echo "Using Android NDK: $NDK"

      - name: Download Lua 5.4.7 source
        run: |
          curl -sSL https://www.lua.org/ftp/lua-5.4.7.tar.gz | tar -xz
          echo "Lua 5.4.7 siap"

      - name: Compile Lua 5.4 objects with Android NDK
        run: |
          LUA_DIR="lua-5.4.7/src"
          for f in "$LUA_DIR"/*.c; do
            fname=$(basename "$f")
            [ "$fname" = "lua.c" ] && continue
            [ "$fname" = "luac.c" ] && continue
            $TOOLCHAIN/armv7a-linux-androideabi24-clang -O2 -DLUA_USE_LINUX -I"$LUA_DIR" -c "$f" -o "${f%.c}.o"
          done
          echo "Lua objects ARM32 selesai."

      - name: Compile Luai ARM32 Binary
        run: |
          LUA_DIR="lua-5.4.7/src"
          LUA_OBJS=$(ls "$LUA_DIR"/*.o)
          $TOOLCHAIN/armv7a-linux-androideabi24-clang++ -O2 -std=c++17 -DUSE_LUA54 -static-libstdc++ \
            -I"$LUA_DIR" src/lexer.cpp src/runtime.cpp src/repl.cpp src/main.cpp \
            $LUA_OBJS -o luai-arm32
          $TOOLCHAIN/llvm-strip luai-arm32
          ls -lh luai-arm32
          file luai-arm32

      - name: Upload ARM32 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luai-arm32
          path: luai-arm32

  build-x86_64:
    name: Build x86_64 with Android NDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | tail -n 1)
          fi
          echo "NDK_PATH=$NDK" >> $GITHUB_ENV
          echo "TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_ENV
          echo "Using Android NDK: $NDK"

      - name: Build LuaJIT for Android x86_64
        run: |
          make -C luajit/src clean
          make -C luajit/src -j$(nproc) \
            STATIC_CC="$TOOLCHAIN/x86_64-linux-android24-clang" \
            DYNAMIC_CC="$TOOLCHAIN/x86_64-linux-android24-clang -fPIC" \
            TARGET_LD="$TOOLCHAIN/x86_64-linux-android24-clang" \
            TARGET_AR="$TOOLCHAIN/llvm-ar rcus" \
            TARGET_STRIP="$TOOLCHAIN/llvm-strip" \
            TARGET_SYS=Linux \
            BUILDMODE=static \
            XCFLAGS="-DLUAJIT_ENABLE_LUA52COMPAT -DLUAJIT_UNWIND_EXTERNAL"

      - name: Compile Luai x86_64 Binary
        run: |
          $TOOLCHAIN/x86_64-linux-android24-clang++ -O2 -std=c++17 -static-libstdc++ \
            -Iluajit/src src/lexer.cpp src/runtime.cpp src/repl.cpp src/main.cpp \
            luajit/src/libluajit.a -o luai-x86_64
          $TOOLCHAIN/llvm-strip luai-x86_64
          ls -lh luai-x86_64
          file luai-x86_64

      - name: Upload x86_64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luai-x86_64
          path: luai-x86_64

  package-and-release:
    name: Package Archives & Publish to GitHub Releases
    needs: [build-arm64, build-arm32, build-x86_64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Zip Tool
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Download ARM64 Binary
        uses: actions/download-artifact@v4
        with:
          name: luai-arm64
          path: ./bin-arm64

      - name: Download ARM32 Binary
        uses: actions/download-artifact@v4
        with:
          name: luai-arm32
          path: ./bin-arm32

      - name: Download x86_64 Binary
        uses: actions/download-artifact@v4
        with:
          name: luai-x86_64
          path: ./bin-x86_64

      - name: Assemble Termux Package Directory
        run: |
          cp -f bin-arm64/luai-arm64 luai-termux/luai-arm64
          cp -f bin-arm32/luai-arm32 luai-termux/luai-arm32
          cp -f bin-x86_64/luai-x86_64 luai-termux/luai-x86_64
          cp -f bin-arm64/luai-arm64 luai-termux/luai
          chmod +x luai-termux/luai* luai-termux/install.sh

          tar -czvf luai-termux.tar.gz luai-termux/
          zip -r luai-termux.zip luai-termux/
          ls -lh luai-termux/ luai-termux.tar.gz luai-termux.zip

      - name: Upload Complete Termux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luai-termux-all-packages
          path: |
            luai-termux/luai-arm64
            luai-termux/luai-arm32
            luai-termux/luai-x86_64
            luai-termux/luai
            luai-termux.tar.gz
            luai-termux.zip

      - name: Publish Binaries to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="v1.0.0"
          fi

          FILES="luai-termux/luai-arm64 luai-termux/luai-arm32 luai-termux/luai-x86_64 luai-termux/luai luai-termux.tar.gz luai-termux.zip"

          echo ">>> Upload ke release: $TAG_NAME"
          gh release upload "$TAG_NAME" $FILES --clobber || true

          echo ">>> Upload ke release: BINARY (background)"
          gh release upload "BINARY" $FILES --clobber 2>/dev/null &

          wait
          echo ">>> Semua upload selesai!"
